<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="...descrição do site...">
    <meta name="author" content="Gerson Azevedo">
    <title>Plan Your Trip - Grand Canyon Adventures</title>
    
    <!-- Google Fonts do seu site plan -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <!-- HEADER com navegação -->
    <header>
        <div class="logo">🏔️ Grand Canyon Adventures</div>
        <button class="hamburger" id="hamburgerBtn">☰</button>
        <nav id="mainNav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="trails.html">Trails</a></li>
                <li><a href="plan.html">Plan Your Trip</a></li>
            </ul>
        </nav>
    </header>

    <!-- MAIN - conteúdo específico de cada página -->
    <main>

        <form id="tripPlannerForm" novalidate>
            <!-- Campo de texto -->
            <div class="form-group">
                <label for="visitorName">Your Name *</label>
                <input type="text" id="visitorName" name="visitorName" required>
            </div>
            
            <!-- Campo de data -->
            <div class="form-group">
                <label for="visitDate">Visit Date *</label>
                <input type="date" id="visitDate" name="visitDate" required>
            </div>
            
            <!-- Campo numérico -->
            <div class="form-group">
                <label for="groupSize">Group Size *</label>
                <input type="number" id="groupSize" name="groupSize" min="1" max="20" required>
            </div>
            
            <!-- Select dropdown -->
            <div class="form-group">
                <label for="experienceLevel">Experience Level *</label>
                <select id="experienceLevel" name="experienceLevel" required>
                    <option value="">Select...</option>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                </select>
            </div>
            
            <!-- Checkboxes -->
            <div class="form-group">
                <label>Interests</label>
                <input type="checkbox" name="interests" value="photography"> Photography
                <input type="checkbox" name="interests" value="hiking"> Hiking
                <input type="checkbox" name="interests" value="camping"> Camping
            </div>
            
            <!-- Textarea -->
            <div class="form-group">
                <label for="specialRequests">Special Requests</label>
                <textarea id="specialRequests" name="specialRequests" rows="4"></textarea>
            </div>
            
            <!-- Botões -->
            <button type="submit">Get Recommendations</button>
            <button type="reset">Clear</button>
        </form>

    </main>

    <!-- FOOTER com link para referências -->
    <footer>
        <p>Copyright © 2026 Grand Canyon Adventures | Gerson Azevedo | WDD 131</p>
        <p><a href="references.html">View References</a></p>
    </footer>

    <!-- JavaScript no final do body -->
    <script src="scripts/main.js"></script>
</body>
</html>
